<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHEAP FASHION</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0c0e11;
  --glass:rgba(24,27,32,0.55);
  --line:rgba(232,228,219,0.14);
  --line-strong:rgba(214,190,145,0.55);
  --text:#ebe8e1;
  --muted:#9097a0;
  --accent:#d6be91;   /* șampanie */
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  font-family:'Jost',Arial,sans-serif;
  font-weight:300;
  background:var(--ink);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
}

/* fundal: poza ta, ușor estompată și întunecată */
body::before{
  content:"";
  position:fixed;
  inset:-20px;
  z-index:-1;
  background:
    linear-gradient(180deg,rgba(12,14,17,0.82),rgba(12,14,17,0.94)),
    url("fundal.png") center/cover no-repeat;
  filter:blur(6px) saturate(0.6);
}

/* ---------- header ---------- */
header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px clamp(20px,5vw,64px);
  background:rgba(12,14,17,0.6);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

header h1{
  font-size:18px;
  font-weight:400;
  letter-spacing:0.42em;
  color:var(--text);
}

header span{
  font-size:13px;
  letter-spacing:0.12em;
  color:var(--muted);
}

/* ---------- hero ---------- */
.hero{
  max-width:1100px;
  margin:0 auto;
  padding:clamp(70px,12vw,150px) clamp(20px,5vw,64px) 60px;
  text-align:left;
}

.hero h2{
  font-size:clamp(40px,7vw,84px);
  font-weight:200;
  line-height:1.05;
  letter-spacing:-0.01em;
  margin-bottom:28px;
}

.hero p{
  display:inline-block;
  color:var(--muted);
  font-size:16px;
  letter-spacing:0.08em;
  padding-top:18px;
  border-top:1px solid var(--line-strong);
}

/* ---------- produse ---------- */
.products{
  max-width:1100px;
  margin:0 auto;
  padding:20px clamp(20px,5vw,64px) 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:28px;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  transition:border-color .35s ease, transform .35s ease;
}

.card:hover{
  border-color:var(--line-strong);
  transform:translateY(-4px);
}

.frame{
  overflow:hidden;
  aspect-ratio:4/5;
  background:linear-gradient(160deg,#1c2026,#12151a);
}

.image{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  color:var(--muted);
  font-size:13px;
  transition:transform .8s ease;
}

.card:hover .image{
  transform:scale(1.04);
}

.info{
  padding:22px 22px 24px;
}

.info h2{
  font-size:20px;
  font-weight:400;
  letter-spacing:0.02em;
}

.info p{
  margin-top:4px;
  font-size:14px;
  color:var(--muted);
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--line);
}

.price{
  font-size:18px;
  font-weight:400;
  color:var(--accent);
  letter-spacing:0.04em;
}

.buy{
  padding:8px 18px;
  font-family:inherit;
  font-size:13px;
  font-weight:400;
  letter-spacing:0.08em;
  color:var(--text);
  background:transparent;
  border:1px solid var(--line-strong);
  border-radius:999px;
  cursor:pointer;
  transition:background .25s ease, color .25s ease;
}

.buy:hover{
  background:var(--accent);
  color:var(--ink);
}

.buy:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

/* ---------- footer ---------- */
footer{
  padding:40px 20px 50px;
  text-align:center;
  font-size:12px;
  letter-spacing:0.2em;
  color:var(--muted);
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;scroll-behavior:auto !important;}
}

@media (max-width:600px){
  header span{display:none;}
  header h1{font-size:15px;}
}
</style>
</head>

<body>

<header>
  <h1>CHEAP FASHION</h1>
  <span>Colecția 2026</span>
</header>

<section class="hero">
  <h2>Premium<br>streetwear</h2>
  <p>New Collection 2026</p>
</section>

<section class="products">

  <!-- PRODUS 1 -->
  <div class="card">
    <div class="frame"><img class="image" src="produs1.jpg" alt="Hanorac negru"></div>
    <div class="info">
      <h2>Hanorac negru</h2>
      <p>Descriere produs.</p>
      <div class="bottom">
        <div class="price">150 RON</div>
        <button class="buy">Cumpără</button>
      </div>
    </div>
  </div>

  <!-- PRODUS 2 -->
  <div class="card">
    <div class="frame"><img class="image" src="produs2.jpg" alt="Tricou oversize"></div>
    <div class="info">
      <h2>Tricou oversize</h2>
      <p>Descriere produs.</p>
      <div class="bottom">
        <div class="price">80 RON</div>
        <button class="buy">Cumpără</button>
      </div>
    </div>
  </div>

  <!-- PRODUS 3 -->
  <div class="card">
    <div class="frame"><img class="image" src="produs3.jpg" alt="Pantaloni cargo"></div>
    <div class="info">
      <h2>Pantaloni cargo</h2>
      <p>Descriere produs.</p>
      <div class="bottom">
        <div class="price">200 RON</div>
        <button class="buy">Cumpără</button>
      </div>
    </div>
  </div>

</section>

<footer>
  © 2026 CHEAP FASHION
</footer>

</body>
</html>
