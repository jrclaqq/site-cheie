<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHEAP FASHION</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:
linear-gradient(rgba(0,0,0,0.78),rgba(0,0,0,0.88)),
url("poze/fundal.png") center/cover fixed no-repeat #0b0b0b;
color:white;
min-height:100vh;
}

header{
padding:25px;
text-align:center;
background:rgba(0,0,0,0.75);
border-bottom:2px solid #00ff88;
}

header h1{
font-size:50px;
color:#00ff88;
}

.hero{
padding:80px;
text-align:center;
}

.hero h2{
font-size:40px;
margin-bottom:20px;
}

.hero p{
color:#aaa;
}

.products{
display:flex;
justify-content:center;
gap:30px;
padding:50px;
flex-wrap:wrap;
}

.card{
background:#161616;
width:300px;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,255,136,0.3);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

/* poza produsului */
.image{
display:block;
width:100%;
height:250px;
object-fit:cover;
background:linear-gradient(45deg,#00ff88,#00aaff);
}

.info{
padding:20px;
}

.price{
color:#00ff88;
font-size:25px;
margin-top:10px;
}

.buy{
margin-top:15px;
width:100%;
padding:12px;
border:none;
background:#00ff88;
font-weight:bold;
cursor:pointer;
border-radius:10px;
}

footer{
padding:30px;
text-align:center;
color:gray;
margin-top:50px;
}

@media (max-width:600px){
header h1{font-size:32px;}
.hero{padding:40px 20px;}
.products{padding:30px 15px;}
}
</style>

</head>

<body>

<header>
<h1>CHEAP FASHION</h1>
</header>

<section class="hero">
<h2>Premium Streetwear</h2>
<p>New Collection 2026</p>
</section>

<section class="products">

<!-- PRODUS 1 -->
<div class="card">
<img class="image" src="poze/produs1.jpg" alt="Produs 1">
<div class="info">
<h2>Hanorac negru</h2>
<p>Descriere produs.</p>
<div class="price">150 RON</div>
<button class="buy">CUMPĂRĂ</button>
</div>
</div>

<!-- PRODUS 2 -->
<div class="card">
<img class="image" src="poze/produs2.jpg" alt="Produs 2">
<div class="info">
<h2>Tricou oversize</h2>
<p>Descriere produs.</p>
<div class="price">80 RON</div>
<button class="buy">CUMPĂRĂ</button>
</div>
</div>

<!-- PRODUS 3 -->
<div class="card">
<img class="image" src="poze/produs3.jpg" alt="Produs 3">
<div class="info">
<h2>Pantaloni cargo</h2>
<p>Descriere produs.</p>
<div class="price">200 RON</div>
<button class="buy">CUMPĂRĂ</button>
</div>
</div>

</section>

<footer>
© 2026 CHEAP FASHION
</footer>

</body>
</html>
